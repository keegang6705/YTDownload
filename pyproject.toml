[project]
name = "ytdownload"
version = "5.0.0"
description = "Modern YouTube / YouTube Music downloader built on yt-dlp + ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.15",
    "rich>=13.7.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]

[tool.uv]
package = false
